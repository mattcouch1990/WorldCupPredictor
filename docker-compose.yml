version: '3.9'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - db_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Host nginx terminates TLS on :443 and reverse-proxies to :8080 here,
    # so the container publishes on 8080 to avoid colliding with host nginx.
    # For local-only smoke tests, point a browser at http://localhost:8080.
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
